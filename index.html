<style>
:root{--red:#E3141B;--yel:#FFC21A;--ink:#1C0F0D;--ink-2:#6A5148;--cream:#FFF8EC}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:600 16px/1.5 "Nunito","Tajawal",system-ui,sans-serif}
[dir=rtl] body{font-family:"Tajawal","Nunito",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{padding:28px 0 10px}header .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header img{height:64px}
.lang{margin-inline-start:auto;display:flex;background:#fff;border-radius:999px;padding:4px;gap:2px}
.lang button{border:0;background:none;font:800 12px/1 inherit;padding:9px 11px;border-radius:999px;cursor:pointer;color:var(--ink-2)}.lang button.on{background:var(--yel);color:var(--ink)}
h1{font:400 clamp(40px,6vw,72px)/.95 "Bebas Neue","Oswald","Lalezar",sans-serif;margin:24px 0 8px;text-transform:uppercase}
[lang=ru] h1{font-weight:700}[dir=rtl] h1{line-height:1.2}
.sub{color:var(--ink-2);margin:0 0 30px;max-width:640px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:28px;text-decoration:none;color:var(--ink);min-height:190px;background:#fff;transition:transform .25s,box-shadow .25s;overflow:hidden}
.tile:hover{transform:translateY(-4px);box-shadow:0 24px 40px -26px rgba(80,20,10,.5)}
.tile .ic{font-size:40px}.tile b{font:800 24px/1.1 "Baloo 2","Lalezar","Nunito",sans-serif}.tile span{color:var(--ink-2);font-size:14.5px}
.tile.a{background:var(--ink);color:#fff}.tile.a span{color:#E9D9CC}.tile.b{background:var(--red);color:#fff}.tile.b span{color:#FFE1D9}.tile.c{background:var(--yel)}.tile.c span{color:#4A2A10}
.flow{margin-top:26px;background:#fff;border-radius:22px;padding:18px 22px;font-weight:800}
.acc{margin-top:18px;background:#fff;border-radius:22px;padding:18px 22px}
.acc h3{margin:0 0 10px;font:800 18px/1.2 "Baloo 2","Lalezar","Nunito",sans-serif}
.acc table{width:100%;border-collapse:collapse;font-size:14.5px}.acc td{padding:8px 6px;border-top:1px solid #F1E6DA}.acc td:last-child{font-weight:900;direction:ltr;unicode-bidi:isolate;text-align:end}
footer{padding:30px 0;color:var(--ink-2);font-size:13px}
</style></head><body>

<main class="wrap">

</div>

</table></div>
</main>
