:root{--green:#1D5A3A;--green-d:#123D27;--yellow:#FFC21A;--cream:#FFF4E0;--ink:#241A14;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--green-d);color:var(--cream);font-family:'Rubik',system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:min(330px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:rgba(18,61,39,.92);border:2px solid var(--yellow);border-radius:18px;padding:14px 16px}

.ui h1{font-size:18px;margin:4px 0}.ui p{font-size:13px;opacity:.85;margin:4px 0 10px}
.ui ol{margin:0;padding-inline-start:22px;font-size:13.5px;line-height:1.55}.ui li{cursor:pointer}.ui li:hover,.ui li.on{color:var(--yellow)}
