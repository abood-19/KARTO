 const rows=Object.entries(r[2]), tot=rows.reduce((a,[,g])=>a+g,0);
 const fmt=g=>{const v=g*batch; return v>=1000?(v/1000).toFixed(v%1000?2:0)+" كغ":(Math.round(v*10)/10)+" غ"};
 return `<div class="rec-tabs" role="group" aria-label="النوع"><button type="button" data-kind="spice" aria-pressed="${recKind==="spice"}">🌶️ البهارات (7)</button><button type="button" data-kind="sauce" aria-pressed="${recKind==="sauce"}">🥫 الصوصات (4)</button></div>

 ${rows.map(([n,g])=>`<tr><td>${esc(n)}</td><td class="g">${fmt(g)}</td><td>${(g/tot*100).toFixed(1)}%</td></tr>`).join("")}</tbody>
 <tfoot><tr><td>المجموع</td><td class="g">${fmt(tot)}</td><td>100%</td></tr></tfoot></table></div>
 ${recKind==="spice"?`<ol class="steps"><li>أوزن بميزان دقته 1 غ.</li><li>اطحن الملح والسكر والأعشاب لحد ما يصيروا متل الطحين.</li><li>انخل كل شي واخلط 3–5 دقائق بوعاء ناشف.</li><li>عبّي بعلب مسكرة. بدون ألبان: لغاية 6 أشهر. بالألبان: لغاية 3 أشهر.</li><li>الاستعمال: 3 / 4 / 5 غ للصغير / الوسط / الكبير، على البطاطا وهي سخنة.</li></ol>`:`<p style="margin:0;font-weight:600">${esc(r[3])}</p><p class="meta" style="margin:0">المايونيز ببيض نيّئ خطر بمحل، فالصوصات البيضاء على مايونيز جاهز 67%.</p>`}
 </div>`}

const DESIGN=[["التغليف (علب ومكاييس)", [["box", "Large box · pizza-style with sauce compartments"], ["bowl", "Medium round bowl"], ["pack", "Small flip-top pack + sauce drawer"], ["chipsbag", "Snack fries bag"], ["whitebag", "White takeaway bag"], ["kraftbag", "Kraft paper bag"], ["potatobag", "Potato-shaped carrier"]]], ["العصير — قنينة", [["bottle-mango", "Juice bottle · Mango"], ["bottle-berry", "Juice bottle · Berry"], ["bottle-lemon", "Juice bottle · Lemon"], ["bottle-orange", "Juice bottle · Orange"]]], ["العصير — علبة", [["can-mango", "Clear PET can · Mango"], ["can-berry", "Clear PET can · Berry"], ["can-lemon", "Clear PET can · Lemon"], ["can-orange", "Clear PET can · Orange"]]], ["العصير — كيس بشلمونة", [["pouche-mango", "Stand-up pouch · Mango"], ["pouche-berry", "Stand-up pouch · Berry"], ["pouche-lemon", "Stand-up pouch · Lemon"], ["pouche-orange", "Stand-up pouch · Orange"]]], ["المي", [["water", "KARTO water 0.5 L · frosted bottle"]]], ["البهارات (برطمانات بغطا خشب)", [["jar-classic", "Spice jar · Classic"], ["jar-cheese", "Spice jar · Cheese"], ["jar-spicy", "Spice jar · Spicy"], ["jar-bbq", "Spice jar · BBQ"], ["jar-garlic", "Spice jar · Garlic"], ["jar-herbs", "Spice jar · Herbs"], ["jar-sour", "Spice jar · Sour Cream"]]], ["الصوصات (كاسات 30 مل بغطا)", [["sauce-ketchup", "Sauce cup · Ketchup"], ["sauce-cheese", "Sauce cup · Cheese"], ["sauce-garlic", "Sauce cup · Garlic"], ["sauce-bbq", "Sauce cup · BBQ"]]]];
function design(){return DESIGN.map(([t,l])=>`<h3 class="dz-h">${esc(t)}</h3><div class="dz">${l.map(([f,n])=>`<figure><a href="design/${f}.webp" target="_blank" rel="noopener"><img src="design/${f}.webp" alt="${esc(n)}" loading="lazy"></a><figcaption>${esc(n)}</figcaption></figure>`).join("")}</div>`).join("")}
function render(){
 const sec=SECTIONS.find(s=>s.id===cur), q=$("#q").value.trim();
 const tabs=SECTIONS.map(s=>{const n=ITEMS.filter(i=>i[1]===s.id).length;return `<button class="tab" role="tab" data-tab="${s.id}" aria-selected="${s.id===cur&&!q}">${s.icon} ${s.name}${n?` <span class="n">${n}</span>`:""}</button>`}).join("");
 $("#tabs").innerHTML=tabs;
 let body;
 if(q){const ql=q.toLowerCase(); const hits=ITEMS.filter(i=>(i[2]+" "+i[4].join(" ")+" "+i[7]+" "+i[8]+" "+i[9]).toLowerCase().includes(ql));
  body=`<div class="sec-head"><h2>نتائج «${esc(q)}»</h2><p>${hits.length} منتج</p></div>`+(hits.length?`<div class="grid">${hits.map(card).join("")}</div>`:`<p class="empty">ما في نتائج. جرّب كلمة ثانية.</p>`);}
 else{ const items=ITEMS.filter(i=>i[1]===cur);
  body=`<div class="sec-head"><h2>${sec.icon} ${sec.name}</h2></div><p class="note">${esc(sec.lead)}</p>`+
   (cur==="guide"?guide():cur==="recipes"?recipes():cur==="ship"?shipping():cur==="design"?design():`<div class="grid">${items.map(card).join("")}</div>`);}
 $("#main").innerHTML=body;
 const total=ITEMS.filter(i=>i[3]!=="uz").length, d=ITEMS.filter(i=>i[3]!=="uz"&&done[i[0]]).length;
 $("#prog").textContent=`انطلب ${d} من ${total}`; $("#barfill").style.width=(d/total*100)+"%";
}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab]"); if(t){cur=t.dataset.tab;$("#q").value="";try{history.replaceState(null,"","#"+cur)}catch(x){location.hash=cur}render();window.scrollTo({top:0,behavior:"smooth"});return}
 const c=e.target.closest("[data-copy]"); if(c){copy(c.dataset.copy);return}
 const k=e.target.closest("[data-kind]"); if(k){recKind=k.dataset.kind;recId=(recKind==="spice"?SPICES:SAUCES)[0][0];render();return}
 const r=e.target.closest("[data-rec]"); if(r){recId=r.dataset.rec;render();return}
});
document.addEventListener("change",e=>{
 const d=e.target.closest("[data-done]"); if(d){done[d.dataset.done]=d.checked;if(!d.checked)delete done[d.dataset.done];saveDone();render();}
});
document.addEventListener("input",e=>{
 if(e.target.id==="q") render();
 if(e.target.id==="batch"){const v=parseFloat(e.target.value);if(v>0){batch=v;const pos=e.target.selectionStart;render();const b=$("#batch");b.focus();try{b.setSelectionRange(pos,pos)}catch(x){}}}
});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(SECTIONS.some(s=>s.id===h)){cur=h;render()}});
render();
</script>
