<!doctype html>
<html lang="uz" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KARTO · Toshkent</title>
<meta name="description" content="KARTO — golden fries in Tashkent. Three sizes, seven spices, house sauces and fresh juices.">
<link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#E3141B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="./assets/karto-fonts.css">
<style>
:root{--red:#E3141B;--red-d:#B00E14;--yel:#FFC21A;--yel-l:#FFE7A1;--cream:#FFF8EC;--cream-2:#FBEFD9;--ink:#1C0F0D;--ink-2:#6A5148;--line:#EFE3D2;
--disp:"Bebas Neue","Oswald","Lalezar",Impact,sans-serif;--fun:"Baloo 2","Lalezar","Nunito",sans-serif;--body:"Nunito","Tajawal",system-ui,sans-serif;--r:28px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:600 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
[dir=rtl] body{font-family:"Tajawal","Nunito",system-ui,sans-serif}
.mul{mix-blend-mode:multiply}
/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,248,236,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:86px}
.nav__logo img{height:60px;width:auto}
.nav__links{display:flex;gap:4px;margin-inline-start:auto}
.nav__links a{text-decoration:none;font:700 15px/1 var(--body);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-radius:999px;transition:.2s}
[dir=rtl] .nav__links a{letter-spacing:0;font-size:16px}
.nav__links a:hover{background:#fff;color:var(--red)}
.lang{display:flex;background:#fff;border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 0 var(--line)}
.lang button{border:0;background:none;font:800 12px/1 var(--body);padding:9px 10px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
.lang button.on{background:var(--yel);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:#fff;text-decoration:none;border:0;border-radius:999px;padding:7px 22px 7px 7px;font:800 15px/1 var(--body);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap}
[dir=rtl] .pill{padding:7px 7px 7px 22px;letter-spacing:0}
.pill i{width:40px;height:40px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-style:normal}
.pill i svg{width:20px;height:20px}
.pill:hover{transform:translateY(-2px);box-shadow:0 14px 26px -14px rgba(28,15,13,.7)}
.pill--red{background:var(--red)}.pill--red i{background:#fff}
.ghost{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:800 15px/1 var(--body);text-transform:uppercase;padding:16px 22px;border-radius:999px;border:2px solid var(--ink);transition:.2s}
.ghost:hover{background:var(--ink);color:#fff}
.burger{display:none;border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer}
/* ---------- hero ---------- */
.hero{position:relative;padding:34px 0 60px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1.15fr .7fr;align-items:center;gap:20px}
.kick{display:inline-flex;align-items:center;gap:8px;font:800 13px/1 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--red)}
.kick::before{content:"";width:26px;height:3px;background:var(--red);border-radius:3px}
.hero h1{font:400 clamp(58px,7.4vw,112px)/.9 var(--disp);margin:16px 0 18px;text-transform:uppercase;letter-spacing:.005em}
[lang=ru] .hero h1{font-weight:700;font-size:clamp(46px,5.6vw,86px);line-height:.98}
[dir=rtl] .hero h1{font-size:clamp(50px,6vw,92px);line-height:1.1}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p.lead{max-width:430px;color:var(--ink-2);font-size:17px;margin:0 0 28px}
.hero__cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero__art{position:relative;aspect-ratio:1/1;display:grid;place-items:center}
.hero__art::before{content:"";position:absolute;inset:7%;border-radius:50%;background:#fff;box-shadow:0 0 0 16px #FFE7A1,0 0 0 34px rgba(255,212,92,.35)}
.hero__art img.main{position:relative;width:100%;animation:float 6s ease-in-out infinite}
.hero__art::after{content:"";position:absolute;left:18%;right:18%;bottom:7%;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,40,10,.28),transparent);z-index:0}
@keyframes float{50%{transform:translateY(-12px) rotate(-1deg)}}
.stk{position:absolute;font:800 clamp(20px,2.1vw,30px)/1 var(--fun);padding:10px 20px 6px;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);white-space:nowrap;z-index:2}
.stk--a{left:-4%;top:52%;background:var(--yel);transform:rotate(-8deg)}
.stk--b{left:6%;top:65%;background:var(--red);color:#fff;transform:rotate(-4deg)}
[dir=rtl] .stk--a{left:auto;right:-4%;transform:rotate(8deg)}[dir=rtl] .stk--b{left:auto;right:6%;transform:rotate(4deg)}
.doodle{position:absolute;pointer-events:none}
.d1{top:6%;right:12%;width:70px}.d2{bottom:6%;right:4%;width:46px}.d3{top:18%;left:4%;width:14px;height:14px;border-radius:50%;background:var(--ink)}.d4{bottom:22%;left:46%;width:10px;height:10px;border-radius:50%;background:var(--yel);border:2px solid var(--ink)}
.feats{display:flex;flex-direction:column;gap:26px}
.feat{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center}
.feat i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-style:normal;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.feat b{display:block;font:400 22px/1.05 var(--disp);text-transform:uppercase;letter-spacing:.02em}
[lang=ru] .feat b,[dir=rtl] .feat b{font-weight:700;font-size:19px}
.feat span{font-size:13.5px;color:var(--ink-2);line-height:1.4}
/* ---------- section heads ---------- */
section{position:relative}
.sec{padding:90px 0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.head h2{font:400 clamp(44px,5.4vw,78px)/.92 var(--disp);margin:10px 0 0;text-transform:uppercase}
[lang=ru] .head h2{font-weight:700;font-size:clamp(36px,4.4vw,60px);line-height:1}
[dir=rtl] .head h2{font-size:clamp(38px,4.6vw,64px);line-height:1.15}
.head p{max-width:420px;margin:0;color:var(--ink-2)}
.price{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
/* ---------- fries band ---------- */
.band{margin:0 24px;border-radius:48px;background:var(--red);color:#fff;overflow:hidden;padding:80px 0 70px}
.band::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 18deg);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.band .wrap{position:relative}
.band .kick{color:var(--yel)}.band .kick::before{background:var(--yel)}
.band .head p{color:#FFE1D9}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{position:relative;background:var(--cream);color:var(--ink);border-radius:var(--r);padding:20px 22px 22px;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(0,0,0,.6)}
.card__img{background:#fff;border-radius:20px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.card__img img{width:88%;height:88%;object-fit:contain;transition:transform .4s}
.card:hover .card__img img{transform:scale(1.06) rotate(-1.5deg)}
.card__tag{position:absolute;top:30px;inset-inline-start:32px;background:var(--yel);font:800 12px/1 var(--body);padding:7px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.card h3{font:400 34px/1 var(--disp);margin:18px 0 4px;text-transform:uppercase}
[lang=ru] .card h3,[dir=rtl] .card h3{font-weight:700;font-size:26px;line-height:1.2}
.card .meta{color:var(--ink-2);font-size:14px}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:18px;gap:10px}
.card .row b{font:400 30px/1 var(--disp)}
[lang=ru] .card .row b,[dir=rtl] .card .row b{font-family:"Oswald",sans-serif;font-weight:700;font-size:22px}
.btn-s{background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 18px;font:800 13px/1 var(--body);text-transform:uppercase;letter-spacing:.04em;text-decoration:none;transition:.2s}
.btn-s:hover{background:var(--ink)}
.rules{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.rules span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}
/* ---------- drinks ---------- */
.tabs{display:inline-flex;background:#fff;border-radius:999px;padding:5px;gap:4px;box-shadow:0 1px 0 var(--line)}
.tabs button{border:0;background:none;padding:11px 20px;border-radius:999px;font:800 14px/1 var(--body);cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:#fff}
.drinks{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.dk{background:#fff;border-radius:24px;padding:16px 14px 18px;text-align:center;transition:transform .3s,box-shadow .3s}
.dk:hover{transform:translateY(-5px);box-shadow:0 24px 40px -28px rgba(80,30,10,.45)}
.dk .im{aspect-ratio:3/4;display:grid;place-items:center}
.dk .im img{max-height:100%;width:auto;object-fit:contain;transition:opacity .25s}
.dk h4{margin:10px 0 2px;font:800 18px/1.15 var(--fun)}
.dk .price{font-weight:900;color:var(--red)}
.dk--water{background:linear-gradient(180deg,#EAF6FF,#fff)}
/* ---------- sauces & spices ---------- */
.duo{display:grid;grid-template-columns:1fr;gap:26px}
.panel{background:#fff;border-radius:36px;padding:34px}
.panel h3{font:400 46px/.95 var(--disp);margin:8px 0 6px;text-transform:uppercase}
[lang=ru] .panel h3,[dir=rtl] .panel h3{font-weight:700;font-size:34px;line-height:1.15}
.panel>p{color:var(--ink-2);margin:0 0 20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.panel{display:grid;grid-template-columns:.8fr 2fr;gap:10px 40px;align-items:center}.panel>.kick,.panel>h3,.panel>p{grid-column:1}.panel>.grid4,.panel>.shelf{grid-column:2;grid-row:1/span 4}.panel>.note{grid-column:1}
.mini{background:var(--cream);border-radius:20px;padding:12px;text-align:center}
.mini img{aspect-ratio:1;object-fit:contain;width:100%}
.mini b{display:block;font:800 16px/1.2 var(--fun);margin-top:6px}
.mini small{color:var(--ink-2);font-weight:800}
.shelf{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;padding:10px 0 0;border-bottom:14px solid #E9C995;border-radius:0 0 6px 6px;box-shadow:0 18px 22px -18px rgba(120,70,10,.6)}
.shelf .j{text-align:center;transition:transform .3s}
.shelf .j:hover{transform:translateY(-8px)}
.shelf img{width:100%;aspect-ratio:3/4.4;object-fit:contain}
.shelf b{display:block;font:800 15px/1.15 var(--fun);margin:6px 0 10px;min-height:34px}
.note{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.note span{background:var(--cream);border-radius:999px;padding:9px 14px;font-weight:800;font-size:13.5px}
/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step{background:#fff;border-radius:28px;padding:26px;position:relative}
.step::before{counter-increment:s;content:counter(s);font:400 64px/1 var(--disp);color:var(--yel);-webkit-text-stroke:2px var(--ink)}
.step h4{font:800 20px/1.2 var(--fun);margin:8px 0 6px}
.step p{margin:0;color:var(--ink-2);font-size:14.5px}
/* ---------- game ---------- */
.game{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:30px;background:var(--yel);border-radius:40px;padding:34px 44px;overflow:hidden}
.game img{width:120px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
.game h3{font:400 52px/.95 var(--disp);margin:0;text-transform:uppercase}
[lang=ru] .game h3,[dir=rtl] .game h3{font-weight:700;font-size:36px;line-height:1.15}
.game p{margin:6px 0 0;font-weight:700}
/* ---------- find us ---------- */
.find{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.info{background:#fff;border-radius:24px;padding:22px}
.info small{display:block;text-transform:uppercase;letter-spacing:.08em;color:var(--red);font-weight:900;font-size:12px;margin-bottom:8px}
[dir=rtl] .info small{letter-spacing:0}
.info b{font:800 18px/1.3 var(--fun);word-break:break-word}
footer{background:var(--ink);color:#F6E9DA;margin-top:90px;padding:56px 0 34px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer img{height:70px}
footer p{margin:0;opacity:.75;font-size:14px}
/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* ---------- responsive ---------- */
@media(max-width:1080px){.panel{grid-template-columns:1fr}.panel>.grid4,.panel>.shelf{grid-column:1;grid-row:auto}.grid4{grid-template-columns:repeat(2,1fr)}.hero .wrap{grid-template-columns:1fr 1fr}.feats{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.feat{flex:1 1 240px}.drinks{grid-template-columns:repeat(3,1fr)}.duo{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.find{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.nav__links{display:none;position:absolute;top:86px;left:16px;right:16px;flex-direction:column;background:#fff;border-radius:24px;padding:12px;box-shadow:0 20px 40px -20px rgba(0,0,0,.3)}.nav__links.open{display:flex}.burger{display:block;margin-inline-start:auto}.nav .pill span{display:none}.nav .pill{padding:7px}
.hero .wrap{grid-template-columns:1fr}.hero__art{order:-1;max-width:460px;margin:30px auto 0;width:86%}.cards{grid-template-columns:1fr}.band{margin:0 10px;border-radius:32px}.game{grid-template-columns:1fr;text-align:center;justify-items:center}}
@media(max-width:560px){.wrap{padding:0 16px}.nav .wrap{gap:10px;height:74px}.nav__logo img{height:48px}.lang button{padding:8px 7px}.drinks{grid-template-columns:repeat(2,1fr)}.shelf{grid-template-columns:repeat(4,1fr);border-bottom-width:10px}.steps,.find{grid-template-columns:1fr}.sec{padding:64px 0}.panel{padding:22px}.stk{font-size:18px}}
</style>
</head><body>

  </nav>
  <div class="lang" id="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="ar">عربي</button></div>

    <svg class="doodle d2" viewBox="0 0 46 46"><path d="M6 40 L40 6 M10 18 L28 4" stroke="#E3141B" stroke-width="5" stroke-linecap="round"/></svg>
    <span class="doodle d3"></span><span class="doodle d4"></span>

    <div class="dk rv"><div class="im"><img class="mul" data-d="lemon" src="./img/juice-lemon.webp" alt=""></div><h4 data-t="jLemon"></h4><span class="price" data-p="lemon">17,000</span></div>

    <div class="dk dk--water rv"><div class="im"><img class="mul" src="./img/water.webp" alt=""></div><h4 data-t="water"></h4><span class="price" data-p="water">5,000</span></div>

<section class="sec" id="sauces" style="padding-top:0"><div class="wrap duo">
